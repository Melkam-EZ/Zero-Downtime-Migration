# Environment (set by docker-compose or the test harness):
#   LEGACY_ADDR / MODERN_ADDR   host:port of each app
#   PROXY_BIND                  e.g. *:8080
#   ADMIN_BIND                  runtime API, e.g. ipv4@0.0.0.0:9999 (never expose publicly: it has admin rights)
#   ERRORFILE                   path to errors-503.http
global
    stats socket "${ADMIN_BIND}" level admin
    maxconn 2000

defaults
    mode http
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    retries 2
    option redispatch
    errorfile 503 "${ERRORFILE}"

frontend web
    bind "${PROXY_BIND}"
    acl is_write method POST PUT PATCH DELETE
    use_backend writers if is_write
    default_backend readers

# Reads can be split between both stacks from the first canary step: the new database is a replica.
backend readers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server legacy "${LEGACY_ADDR}" weight 100 check inter 1s fall 2 rise 2
    server modern "${MODERN_ADDR}" weight 0   check inter 1s fall 2 rise 2

# Writes go to exactly one stack at a time. The migration tool flips these weights at cutover.
backend writers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server legacy "${LEGACY_ADDR}" weight 100 check inter 1s fall 2 rise 2
    server modern "${MODERN_ADDR}" weight 0   check inter 1s fall 2 rise 2
